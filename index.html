<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Атлас | Neural Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="noise"></div>
    <div class="scan-line"></div>
    
    <div class="container">
        <div class="header">
            <div class="glow-text">
                <h1>⚡ АТЛАС ⚡</h1>
                <div class="subtitle">NEURAL ASSISTANT v2.0</div>
            </div>
            <div class="status-panel">
                <div class="status-led" id="statusLed"></div>
                <div class="status-text" id="statusText">STANDBY MODE</div>
                <div class="system-time" id="systemTime"></div>
            </div>
        </div>

        <div class="hologram-container">
            <div class="hologram-ring"></div>
            <div class="hologram-ring ring-2"></div>
            <div class="voice-visualizer" id="voiceVisualizer">
                <div class="wave"></div>
            </div>
            <button class="core-button" id="voiceButton">
                <div class="button-glow"></div>
                <span class="mic-icon">🎙️</span>
            </button>
        </div>

        <div class="command-hint">
            <div class="hint-text">» ACTIVATION: "АТЛАС" + COMMAND «</div>
            <div class="command-grid">
                <div class="command-chip">🔍 ПОИСК</div>
                <div class="command-chip">📱 ПРИЛОЖЕНИЯ</div>
                <div class="command-chip">🌐 БРАУЗЕР</div>
                <div class="command-chip">🎵 МУЗЫКА</div>
            </div>
        </div>

        <div class="conversation" id="conversation">
            <div class="message assistant">
                <div class="message-icon">⚡</div>
                <div class="message-content">
                    <span class="typing-text">SYSTEM ONLINE. READY FOR COMMAND.</span>
                </div>
            </div>
        </div>

        <div class="input-terminal">
            <div class="terminal-prefix">ATLAS:~$</div>
            <input type="text" id="textInput" placeholder="введите команду..." />
            <button id="sendButton">EXECUTE</button>
        </div>
        
        <div class="footer-stats">
            <div class="stat" id="cpuStat">⚙️ CPU: --</div>
            <div class="stat" id="memStat">💾 RAM: --</div>
            <div class="stat">🔒 ENCRYPTED</div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
